{% load i18n %}
<header class="bg-blue-700 text-white shadow-[0_6px_18px_rgba(15,76,92,0.18)]">
  <div class="mx-auto flex max-w-5xl items-center justify-between gap-4 px-4 py-3">
    <a href="{% url 'home' %}" aria-label="BÒRD PRO" class="text-xl font-extrabold tracking-[0.12em] text-white">BÒRD<span class="text-coral-400"> PRO</span></a>
    {% if user.is_authenticated %}
      <nav aria-label="{% translate 'Navigation principale' %}" class="header-nav hidden sm:flex sm:flex-1 sm:justify-center sm:gap-2 text-sm">
        {% include "components/_nav.html" with link_class="nav-link" active_class="" %}
      </nav>
      <form method="post" action="{% url 'account_logout' %}">
        {% csrf_token %}
        <button type="submit" class="min-h-11 rounded-full px-3 text-sm font-medium text-white/80 hover:bg-white/10 hover:text-white">
          {% translate "Se déconnecter" %}
        </button>
      </form>
    {% endif %}
  </div>
</header>
