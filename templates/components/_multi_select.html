{% load i18n %}
<details
  class="group rounded-lg border border-stone-300 bg-white"
  data-summary="{{ widget.summary }}"
  x-data="{
    summary: $el.dataset.summary,
    update() {
      this.summary = [...this.$root.querySelectorAll('input:checked')].map(i => i.dataset.label).join(', ');
    },
  }"
  @keydown.escape="$root.removeAttribute('open')"
>
  <summary class="flex min-h-11 cursor-pointer list-none items-center justify-between gap-2 px-3 py-2">
    <span class="min-w-0 wrap-anywhere" :class="summary ? 'text-stone-900' : 'text-stone-500'" x-text="summary || '{% translate "Choisir…" %}'">{% if widget.summary %}{{ widget.summary }}{% else %}{% translate "Choisir…" %}{% endif %}</span>
    <span aria-hidden="true" class="shrink-0 text-stone-500 transition group-open:rotate-180">▾</span>
  </summary>
  <div class="max-h-64 space-y-1 overflow-y-auto border-t border-stone-200 p-2">
    {% for option in widget.options %}
      <label class="flex min-h-11 cursor-pointer items-center gap-3 rounded-md px-2 font-normal hover:bg-stone-50">
        <input type="checkbox" name="{{ option.name }}" value="{{ option.value }}" data-label="{{ option.label }}" id="{{ option.attrs.id }}" {% if option.selected %}checked{% endif %} @change="update()">
        <span>{{ option.label }}</span>
      </label>
    {% endfor %}
  </div>
</details>
