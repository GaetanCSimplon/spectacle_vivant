{% comment %}
  "+" button of a list header. On a phone it is a round "+" (the text would wrap and make the
  button huge); from `sm` up it shows "+ label". Params: url, label (no "+").
{% endcomment %}
<a href="{{ url }}" class="btn btn-primary shrink-0 !px-0 w-11 sm:w-auto sm:!px-5" aria-label="{{ label }}">
  <span aria-hidden="true" class="text-2xl font-bold leading-none sm:hidden">+</span>
  <span class="hidden sm:inline">+ {{ label }}</span>
</a>
