{% load i18n %}
{% comment %}
  Live-search box. Params: `url` (the list URL), `type` (optional, kept in the query), `q` (current query), `placeholder`.
  Works without JavaScript too: it is a plain GET form.
{% endcomment %}
<form method="get" action="{{ url }}" class="mb-4" role="search">
  {% if type %}<input type="hidden" name="type" value="{{ type }}">{% endif %}
  <input
    type="search"
    name="q"
    value="{{ q }}"
    placeholder="{{ placeholder }}"
    aria-label="{{ placeholder }}"
    autocomplete="off"
    class="w-full rounded-md border border-gray-300 px-3 py-2 text-sm"
    hx-get="{{ url }}{% if type %}?type={{ type }}{% endif %}"
    hx-trigger="input changed delay:300ms, search"
    hx-target="#results"
    hx-swap="innerHTML"
  >
</form>
