{% comment %}Status pill for a gig (`gig` in context). Option = to watch (amber), confirmed = green,
signed = solid green, cancelled = grey. The label always says it: colour is never alone.{% endcomment %}
<span class="pill shrink-0 {% if gig.status == 'option' %}pill-warn{% elif gig.status == 'confirmed' %}pill-good{% elif gig.status == 'signed' %}pill-good-strong{% else %}pill-neutral{% endif %}">
  {{ gig.get_status_display }}
</span>
