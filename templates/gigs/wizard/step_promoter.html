{% extends "gigs/wizard/wizard_base.html" %}
{% load i18n %}

{% block title %}Nouvelle date — Organisateur{% endblock %}

{% block wizard_content %}
  <h1 class="mb-4">{% translate "Quel organisateur ?" %}</h1>

  <div
    x-data="{ mode: '{% if create_form.errors %}new{% elif not has_choices %}new{% else %}existing{% endif %}' }"
    class="space-y-6"
  >
    <div class="flex gap-4 border-b border-gray-200 text-sm">
      <button
        type="button"
        @click="mode = 'existing'"
        :class="mode === 'existing' ? 'border-b-2 border-blue-600 text-blue-700' : 'text-gray-500'"
        class="pb-2"
      >
        {% translate "Choisir un organisateur existant" %}
      </button>
      <button
        type="button"
        @click="mode = 'new'"
        :class="mode === 'new' ? 'border-b-2 border-blue-600 text-blue-700' : 'text-gray-500'"
        class="pb-2"
      >
        {% translate "Créer un nouvel organisateur" %}
      </button>
    </div>

    <form method="post" x-show="mode === 'existing'">
      {% csrf_token %}
      <input type="hidden" name="mode" value="existing">
      {{ choice_form.as_p }}
      <button type="submit" class="btn btn-primary btn-block mt-4">
        {% translate "Continuer" %}
      </button>
    </form>

    <form method="post" x-show="mode === 'new'">
      {% csrf_token %}
      <input type="hidden" name="mode" value="new">
      {{ create_form.as_p }}
      <button type="submit" class="btn btn-primary btn-block mt-4">
        {% translate "Créer et continuer" %}
      </button>
    </form>
  </div>
{% endblock %}
