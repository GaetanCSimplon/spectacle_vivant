{% extends "gigs/wizard/wizard_base.html" %}
{% load i18n %}

{% block title %}Nouvelle date — Détails{% endblock %}

{% block wizard_content %}
  <h1 class="mb-4">{% translate "Quand et à quel prix ?" %}</h1>

  <form method="post" class="space-y-4">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary btn-block">
      {% translate "Continuer" %}
    </button>
  </form>
{% endblock %}
