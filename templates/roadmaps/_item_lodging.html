<p class="font-medium">{{ item.name }}{% if item.day %} · {{ item.day|date:"D j/m" }}{% endif %}{% if item.arrival_time %} · {{ item.arrival_time|time:"H:i" }}{% endif %}</p>
{% if item.full_address %}<p class="text-gray-600">{{ item.full_address|linebreaksbr }}</p>{% endif %}
{% if item.notes %}<p class="text-gray-600">{{ item.notes|linebreaksbr }}</p>{% endif %}
