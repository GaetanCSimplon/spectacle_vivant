{% load static tailwind_cli i18n %}
<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <meta name="referrer" content="same-origin">
    <title>{% block title %}BÒRD PRO{% endblock %}</title>
    {% tailwind_css %}
  </head>
  <body class="min-h-screen bg-page text-stone-900">
    <header class="border-b border-page-line bg-white">
      <div class="mx-auto max-w-xl px-4 py-3">
        <span class="font-heading text-lg font-semibold tracking-wide text-blue-700" aria-label="BÒRD PRO">BÒRD PRO</span>
      </div>
    </header>
    <main class="mx-auto max-w-xl px-4 py-6">
      {% block content %}{% endblock %}
    </main>
  </body>
</html>
