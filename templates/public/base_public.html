{% load static tailwind_cli i18n %}
<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <meta name="referrer" content="same-origin">
    <title>{% block title %}Bòrd Pro{% endblock %}</title>
    <link rel="icon" href="{% static 'brand/favicon.ico' %}" sizes="48x48">
    <link rel="icon" type="image/png" sizes="32x32" href="{% static 'brand/favicon-32.png' %}">
    <link rel="icon" type="image/png" sizes="16x16" href="{% static 'brand/favicon-16.png' %}">
    <link rel="apple-touch-icon" href="{% static 'brand/apple-touch-icon.png' %}">
    <meta name="theme-color" content="#FFFFFF">
    {% tailwind_css %}
  </head>
  <body class="min-h-screen bg-page text-stone-900">
    <header class="border-b border-page-line bg-white">
      <div class="mx-auto max-w-xl px-4 py-2">
        <img src="{% static 'brand/logo.svg' %}" alt="Bòrd Pro" width="2000" height="800" class="h-auto w-36">
      </div>
    </header>
    <main class="mx-auto max-w-xl px-4 py-6">
      {% block content %}{% endblock %}
    </main>
  </body>
</html>
