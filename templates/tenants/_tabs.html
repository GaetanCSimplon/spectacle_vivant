{% load i18n %}
{% comment %}Switch between the parts of "Bòrd". `active` = bord | expenses | documents | team | settings.{% endcomment %}
<div class="mb-4 flex gap-4 border-b border-gray-200 text-sm">
  <a
    href="{% url 'tenants:profile' %}"
    class="-mb-px border-b-2 pb-2 {% if active == 'bord' %}border-blue-700 font-semibold text-blue-700{% else %}border-transparent text-gray-600 hover:text-gray-900{% endif %}"
    {% if active == 'bord' %}aria-current="true"{% endif %}
  >{% translate "Tableau de bord" %}</a>
  <a
    href="{% url 'bord-expenses' %}"
    class="-mb-px border-b-2 pb-2 {% if active == 'expenses' %}border-blue-700 font-semibold text-blue-700{% else %}border-transparent text-gray-600 hover:text-gray-900{% endif %}"
    {% if active == 'expenses' %}aria-current="true"{% endif %}
  >{% translate "Dépenses" %}</a>
  <a
    href="{% url 'document-library' %}"
    class="-mb-px border-b-2 pb-2 {% if active == 'documents' %}border-blue-700 font-semibold text-blue-700{% else %}border-transparent text-gray-600 hover:text-gray-900{% endif %}"
    {% if active == 'documents' %}aria-current="true"{% endif %}
  >{% translate "Documents émis" %}</a>
</div>
