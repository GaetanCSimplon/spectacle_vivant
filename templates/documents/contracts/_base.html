<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <style>
      @page {
        size: A4;
        margin: 2.5cm 2cm;

        @bottom-center {
          content: "Page " counter(page) " / " counter(pages);
          font-size: 9px;
          color: #666;
        }
      }

      body {
        font-family: sans-serif;
        font-size: 11px;
        color: #111;
        line-height: 1.5;
      }

      h1 {
        font-size: 16px;
        text-align: center;
        margin-bottom: 4px;
      }


      .parties {
        display: flex;
        justify-content: space-between;
        margin-bottom: 24px;
      }

      .party {
        width: 48%;
      }

      .party h2 {
        font-size: 11px;
        text-transform: uppercase;
        color: #555;
        margin-bottom: 4px;
      }

      .signatures {
        margin-top: 24px;
        min-height: 90px;
      }

      .approval {
        margin-top: 16px;
        border: 1px solid #999;
        padding: 6px;
        font-size: 10px;
        font-style: italic;
      }

      section {
        margin-bottom: 16px;
      }

      section h2 {
        font-size: 12px;
        margin-bottom: 4px;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        margin: 8px 0;
      }

      th, td {
        border: 1px solid #999;
        padding: 4px 6px;
        text-align: left;
      }

      td.amount, th.amount {
        text-align: right;
      }

      ul {
        margin: 4px 0 8px;
        padding-left: 18px;
      }

      blockquote {
        margin: 6px 0;
        padding-left: 10px;
        border-left: 3px solid #999;
      }

      h3 {
        font-size: 11px;
        margin: 10px 0 4px;
      }

      .annex {
        page-break-before: always;
      }

      .signature-box {
        min-height: 70px;
      }
    </style>
  </head>
  <body>
    {% if logo_uri %}<img src="{{ logo_uri }}" alt="" style="display: block; max-height: 18mm; max-width: 55mm; margin-bottom: 8px;">{% endif %}
    {% block content %}{% endblock %}
  </body>
</html>
