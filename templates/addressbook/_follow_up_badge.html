{% comment %}Coloured label of a promoter's follow-up (needs `promoter`).{% endcomment %}
{% if promoter.follow_up %}
  <span class="badge shrink-0 {% if promoter.follow_up == 'prospect' %}bg-gray-200 text-gray-700{% elif promoter.follow_up == 'negotiating' %}bg-amber-100 text-amber-800{% elif promoter.follow_up == 'signing' %}bg-blue-100 text-blue-800{% elif promoter.follow_up == 'active' %}bg-green-100 text-green-800{% else %}bg-red-100 text-red-800{% endif %}">{{ promoter.get_follow_up_display }}</span>
{% endif %}
