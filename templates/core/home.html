{% extends "base.html" %}
{% load i18n %}

{% block title %}Accueil — Spectacle Vivant{% endblock %}

{% block page_content %}
  {% if tenant %}
    <h1 class="text-xl font-semibold">{{ tenant.name }}</h1>
    <a
      href="{% url 'gigs:wizard-show' %}"
      class="mt-4 inline-block rounded-md bg-blue-600 px-4 py-2 text-sm text-white"
    >
      {% translate "+ Nouvelle date" %}
    </a>
  {% else %}
    <p class="text-gray-600">Aucune structure associée à ce compte pour l'instant.</p>
  {% endif %}
{% endblock %}
