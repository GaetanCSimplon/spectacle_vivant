name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Also every Monday: a new vulnerability can appear without any change on our side.
  schedule:
    - cron: "0 6 * * 1"

env:
  DJANGO_SECRET_KEY: ci-secret-key-not-used-in-prod-but-long-enough-to-silence-w009
  DJANGO_DEBUG: "False"
  DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
  DATABASE_URL: postgres://spectacle:spectacle@localhost:5432/spectacle
  # Dummy values so config.settings.prod loads (nothing is contacted).
  EMAIL_HOST_USER: ci-user
  EMAIL_HOST_PASSWORD: ci-password
  DEFAULT_FROM_EMAIL: ci@example.com

jobs:
  test:
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: spectacle
          POSTGRES_USER: spectacle
          POSTGRES_PASSWORD: spectacle
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U spectacle"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install WeasyPrint system dependencies
        # The Ubuntu mirror of the runners (azure.archive.ubuntu.com) is sometimes unreachable
        # (2026-11-11: four runs in a row failed here, before any test): try again a few times, then
        # fall back on the main archive.
        run: |
          install() {
            sudo apt-get -o Acquire::Retries=5 update &&
            sudo apt-get -o Acquire::Retries=5 install -y --no-install-recommends \
              libpango-1.0-0 libpangocairo-1.0-0 libgdk-pixbuf2.0-0 \
              libcairo2 libharfbuzz-subset0
          }
          for attempt in 1 2 3; do
            install && exit 0
            echo "apt attempt $attempt failed"
            sleep $((attempt * 20))
          done
          echo "Falling back on archive.ubuntu.com"
          sudo sed -i \
            -e 's|mirror+file:/etc/apt/apt-mirrors.txt|http://archive.ubuntu.com/ubuntu/|' \
            -e 's|http://azure.archive.ubuntu.com/ubuntu/|http://archive.ubuntu.com/ubuntu/|' \
            /etc/apt/sources.list.d/ubuntu.sources || true
          install

      - name: Install Python dependencies
        run: pip install -r requirements/dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Check formatting (ruff)
        run: ruff format --check .

      - name: Check for missing migrations
        run: python manage.py makemigrations --check --no-input
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test

      - name: Run tests
        run: pytest

      - name: Collect static files (production settings)
        run: python manage.py collectstatic --noinput
        env:
          DJANGO_SETTINGS_MODULE: config.settings.prod
          S3_BUCKET_NAME: ci-bucket
          S3_ENDPOINT_URL: https://s3.example.com
          S3_REGION_NAME: fr-par
          S3_ACCESS_KEY_ID: ci-access-key
          S3_SECRET_ACCESS_KEY: ci-secret-key

      - name: Deployment checks
        run: python manage.py check --deploy
        env:
          DJANGO_SETTINGS_MODULE: config.settings.prod
          # Dummy values: the check only needs the settings to load, nothing is contacted.
          S3_BUCKET_NAME: ci-bucket
          S3_ENDPOINT_URL: https://s3.example.com
          S3_REGION_NAME: fr-par
          S3_ACCESS_KEY_ID: ci-access-key
          S3_SECRET_ACCESS_KEY: ci-secret-key

  # Known vulnerabilities in the installed packages. A separate job, so that a new advisory
  # shows up in red without blocking the tests of an unrelated change.
  audit:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install -r requirements/prod.txt pip-audit -c requirements/constraints.txt

      - name: Audit (pip-audit)
        run: pip-audit --progress-spinner off
