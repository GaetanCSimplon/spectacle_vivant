version: 2
updates:
  # Python packages: one grouped weekly pull request, tested by the CI before any merge.
  - package-ecosystem: pip
    directory: /requirements
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      python-packages:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      # Stay on the Django 5.2 LTS: moving to another series is a decision, not an update.
      - dependency-name: django
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
