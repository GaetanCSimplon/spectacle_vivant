repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: .venv/bin/ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: .venv/bin/ruff format
        language: system
        types: [python]
      # Before every push: the tests (the same ones as the CI, which costs GitHub minutes).
      - id: pytest
        name: pytest
        entry: .venv/bin/pytest -q -x -n auto
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
