[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations", "docs"]
force-exclude = true

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DJ"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["tests.py", "test_*.py"]
addopts = "-ra"
markers = ["slow: long tests (demo seeding); skipped in daily work with -m \"not slow\", always run before a PR and in the CI"]